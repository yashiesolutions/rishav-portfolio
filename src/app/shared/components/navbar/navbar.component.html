<header class="navbar" [class.navbar--scrolled]="isScrolled()">
  <div class="container navbar__inner">
    <a routerLink="/" class="navbar__brand" (click)="closeMenu()">
      <span class="navbar__brand-mark">RK</span>
      <span class="navbar__brand-text">
        Rishav Kumar
        <span class="navbar__brand-version">v13.6</span>
      </span>
    </a>

    <nav class="navbar__links" [class.navbar__links--open]="isOpen()" aria-label="Primary">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="is-active"
          (click)="closeMenu()"
        >{{ link.label }}</a>
      }
    </nav>

    <button
      class="navbar__toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isOpen()"
      aria-controls="primary-navigation"
      aria-label="Toggle navigation menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
